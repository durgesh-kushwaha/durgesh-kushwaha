    </linearGradient>
    <radialGradient id="glow-light" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid-light" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#475569" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frameClip-light"><rect x="0" y="0" width="1180" height="610" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frameClip-light)">
